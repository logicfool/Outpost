name: Outpost 0.6.4 JavaScript repair and native regression
# Reuse compatible, already compiled native apps. No Xcode build or credential changes.
jobs:
  ios_device:
    type: repack
    environment: preview
    params:
      build_id: eaf4ff98-89de-44a2-ab1e-51e3e688c792
      profile: unsigned-ipa
      embed_bundle_assets: true
      js_bundle_only: false
      message: Outpost 0.6.4 build 11 - verified player cleanup repair
  ios_simulator:
    type: repack
    environment: preview
    params:
      build_id: 868830d4-b7e8-495c-a670-67772998dee3
      profile: release-smoke
      embed_bundle_assets: true
      js_bundle_only: false
      message: Outpost native regression - compatible simulator runtime
  native_regression:
    needs: [ios_simulator]
    type: maestro
    environment: preview
    image: latest
    params:
      build_id: ${{ needs.ios_simulator.outputs.build_id }}
      flow_path: maestro/release-smoke.yml
      record_screen: true
      retries: 0
