build:
  name: Unsigned iOS device IPA (for sideload signing)
  steps:
    - eas/checkout
    - eas/install_node_modules
    - eas/prebuild:
        inputs:
          clean: true
    - run:
        name: Install CocoaPods
        working_directory: ./ios
        command: pod install
    - run:
        name: Build unsigned iPhone app
        working_directory: ./ios
        command: |
          set -euo pipefail
          xcodebuild -workspace Outpost.xcworkspace -scheme Outpost -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -200
    - run:
        name: Package IPA
        working_directory: ./ios
        command: |
          set -euo pipefail
          test -d build/Build/Products/Release-iphoneos/Outpost.app
          rm -rf Payload Outpost-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Outpost.app Payload/
          zip -qry Outpost-unsigned.ipa Payload
          unzip -tq Outpost-unsigned.ipa
          ls -lh Outpost-unsigned.ipa
    - eas/upload_artifact:
        name: Upload IPA
        inputs:
          type: application-archive
          path: ios/Outpost-unsigned.ipa
